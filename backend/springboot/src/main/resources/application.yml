server:
  port: 8081

spring:
  datasource:
    url: 'jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:objetos_perdidos_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8'
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  jpa:
    ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # DATETIME conserva el valor UTC de LocalDateTime sin convertirlo otra vez.
        type.java_time_use_direct_jdbc: true
  mail:
    # Por defecto usa Mailpit (docker compose) -> bandeja en http://localhost:8025
    # Para Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_SMTP_AUTH=true,
    # MAIL_STARTTLS=true, MAIL_USERNAME=<correo>, MAIL_PASSWORD=<contraseña de aplicación>
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    time-zone: UTC

app:
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:5242880}
    max-pixels: ${UPLOAD_MAX_PIXELS:40000000}
  mail:
    from: ${MAIL_FROM:no-reply@foundia.dev}
  web:
    # H35: dirección de la web de usuario para armar el enlace de recuperación
    url: ${WEB_URL:http://localhost:5173}
  # H53: recordatorios de objetos perdidos sin resolver.
  recordatorios:
    habilitados: ${RECORDATORIOS_HABILITADOS:true}
    intervalo-ms: ${RECORDATORIOS_INTERVALO_MS:86400000}
    retraso-inicial-ms: ${RECORDATORIOS_RETRASO_INICIAL_MS:300000}
    dias-sin-resolver: ${RECORDATORIOS_DIAS_SIN_RESOLVER:7}
  jwt:
    secret: ${JWT_SECRET:foundia-dev-jwt-secret-cambiar-en-produccion-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # H45: asistente. Sin clave de IA responde el motor local.
  asistente:
    limite-por-minuto: ${ASISTENTE_LIMITE_POR_MINUTO:20}
    claude:
      enabled: ${ASISTENTE_CLAUDE_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ASISTENTE_CLAUDE_MODEL:claude-sonnet-4-5}
      url: ${ASISTENTE_CLAUDE_URL:https://api.anthropic.com/v1/messages}
      timeout-ms: ${ASISTENTE_CLAUDE_TIMEOUT_MS:8000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
