server:
  port: 8081

spring:
  datasource:
    url: 'jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:objetos_perdidos_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8'
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:foundia-dev-jwt-secret-cambiar-en-produccion-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
