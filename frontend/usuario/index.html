<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FoundIA Tecsup — Objetos perdidos y encontrados del campus." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0b3d91" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar destellos claros.
      (function () {
        try {
          var t = localStorage.getItem('foundia-tema');
          if (t !== 'claro' && t !== 'oscuro') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          document.documentElement.dataset.tema = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = t === 'oscuro' ? '#0e1420' : '#0b3d91';
        } catch (e) { /* sin storage seguimos con el tema claro */ }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>FoundIA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
