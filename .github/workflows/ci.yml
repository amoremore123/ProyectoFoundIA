# CI de FoundIA: pruebas de Spring, Django, las dos webs y Android en cada push y pull request.
# Ninguna prueba usa la base compartida ni claves: Spring usa H2, Django SQLite en memoria,
# la web Vitest y Android pruebas unitarias de JVM.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring:
    name: Spring (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/springboot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  django:
    name: Django (panel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/django-admin/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test nucleo --settings=config.settings_test --noinput

  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [usuario, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android (pruebas unitarias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest
