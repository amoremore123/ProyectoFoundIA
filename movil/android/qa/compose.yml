name: foundia-room-qa-20261027
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: room-qa-temporal
      MYSQL_DATABASE: objetos_perdidos_db
    ports: ["127.0.0.1:13370:3306"]
    volumes:
      - ../../../database/script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
      - ../../../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proom-qa-temporal"]
      interval: 3s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:11370:1025", "127.0.0.1:18370:8025"]
