# =====================================================================
# Plataforma de Objetos Perdidos y Encontrados — infraestructura
# Uso: docker compose up
#   MySQL + API Spring Boot + API Django + Frontend usuario
#   + Frontend admin + Mailpit (correo de pruebas)
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: foundia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: objetos_perdidos_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Carga automática del esquema y los datos iniciales
      - ./database/script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend/springboot
    container_name: foundia-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: objetos_perdidos_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: foundia-dev-jwt-secret-cambiar-en-produccion-123456
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      # H11: correo de verificación -> Mailpit (ver bandeja en http://localhost:8025)
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@foundia.dev
      UPLOAD_DIRECTORY: /app/uploads
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Servidor SMTP de pruebas: atrapa todos los correos que envía la API
  # Bandeja web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: foundia-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  admin-api:
    build: ./backend/django-admin
    container_name: foundia-admin-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: objetos_perdidos_db
      DB_USERNAME: root
      DB_PASSWORD: root
      DJANGO_SECRET_KEY: foundia-dev-django-secret-key-cambiar-en-produccion
      JWT_SECRET: foundia-dev-jwt-secret-cambiar-en-produccion-123456
      DJANGO_DEBUG: "True"
      HABILITAR_EXTRAS: ${HABILITAR_EXTRAS:-false}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend-usuario:
    build: ./frontend/usuario
    container_name: foundia-frontend-usuario
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_HABILITAR_EXTRAS: ${HABILITAR_EXTRAS:-false}
    ports:
      - "5173:5173"
    depends_on:
      - api

  frontend-admin:
    build: ./frontend/admin
    container_name: foundia-frontend-admin
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_HABILITAR_EXTRAS: ${HABILITAR_EXTRAS:-false}
    ports:
      - "5174:5174"
    depends_on:
      - admin-api

volumes:
  mysql_data:
  uploads_data:
