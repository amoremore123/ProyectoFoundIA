# Plataforma de Objetos Perdidos y Encontrados — infraestructura
# Uso: docker compose up
#   MySQL + API Spring Boot + API Django + Frontend usuario
#   + Frontend admin + Mailpit (correo de pruebas)
# ==============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: foundia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: objetos_perdidos_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Carga automática del esquema y los datos iniciales
      - ./database/script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend/springboot
    container_name: foundia-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: objetos_perdidos_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: foundia-dev-jwt-secret-cambiar-en-produccion-123456
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      # H11: correo de verificación -> Mailpit (ver bandeja en http://localhost:8025)
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@foundia.dev
      UPLOAD_DIRECTORY: /app/uploads
      # H45: el asistente usa el motor local si no se configura el proveedor.
      ASISTENTE_CLAUDE_ENABLED: ${ASISTENTE_CLAUDE_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASISTENTE_CLAUDE_MODEL: ${ASISTENTE_CLAUDE_MODEL:-claude-sonnet-4-5}
      ASISTENTE_CLAUDE_URL: ${ASISTENTE_CLAUDE_URL:-https://api.anthropic.com/v1/messages}
      ASISTENTE_CLAUDE_TIMEOUT_MS: ${ASISTENTE_CLAUDE_TIMEOUT_MS:-8000}
      ASISTENTE_LIMITE_POR_MINUTO: ${ASISTENTE_LIMITE_POR_MINUTO:-20}
      # H53: recordatorios de objetos perdidos sin resolver (por defecto, diarios).
      RECORDATORIOS_HABILITADOS: ${RECORDATORIOS_HABILITADOS:-true}
      RECORDATORIOS_DIAS_SIN_RESOLVER: ${RECORDATORIOS_DIAS_SIN_RESOLVER:-7}
      RECORDATORIOS_INTERVALO_MS: ${RECORDATORIOS_INTERVALO_MS:-86400000}
      RECORDATORIOS_RETRASO_INICIAL_MS: ${RECORDATORIOS_RETRASO_INICIAL_MS:-300000}
      # Fase 5: FINDI con IA (Groq u OpenAI). La clave se lee del archivo .env, que no se sube a Git
      IA_URL: ${IA_URL:-https://api.groq.com/openai/v1}
      IA_MODELO: ${IA_MODELO:-llama-3.1-8b-instant}
      IA_API_KEY: ${IA_API_KEY:-}
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Servidor SMTP de pruebas: atrapa todos los correos que envía la API
  # Bandeja web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: foundia-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  admin-api:
    build: ./backend/django-admin
    container_name: foundia-admin-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: objetos_perdidos_db
      DB_USERNAME: root
      DB_PASSWORD: root
      DJANGO_SECRET_KEY: foundia-dev-django-secret-key-cambiar-en-produccion
      JWT_SECRET: foundia-dev-jwt-secret-cambiar-en-produccion-123456
      DJANGO_DEBUG: "True"
      HABILITAR_EXTRAS: ${HABILITAR_EXTRAS:-false}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # H38: respaldo lógico programado. Escribe en su propio volumen y nunca
  # monta mysql_data. Para una ejecución manual:
  #   docker compose run --rm -e RESPALDO_UNA_VEZ=1 respaldo
  respaldo:
    build:
      context: .
      dockerfile: database/respaldo/Dockerfile
    container_name: foundia-respaldo
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: objetos_perdidos_db
      DB_USERNAME: root
      DB_PASSWORD: root
      RESPALDO_DIR: /respaldos
      RESPALDO_INTERVALO_SEGUNDOS: ${RESPALDO_INTERVALO_SEGUNDOS:-86400}
      RESPALDO_RETENCION_DIAS: ${RESPALDO_RETENCION_DIAS:-7}
    volumes:
      - respaldos_data:/respaldos
    depends_on:
      mysql:
        condition: service_healthy

  frontend-usuario:
    build: ./frontend/usuario
    container_name: foundia-frontend-usuario
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_HABILITAR_EXTRAS: ${HABILITAR_EXTRAS:-false}
    ports:
      - "5173:5173"
    depends_on:
      - api

  frontend-admin:
    build: ./frontend/admin
    container_name: foundia-frontend-admin
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_HABILITAR_EXTRAS: ${HABILITAR_EXTRAS:-false}
    ports:
      - "5174:5174"
    depends_on:
      - admin-api

volumes:
  mysql_data:
  uploads_data:
  respaldos_data:
